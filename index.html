<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internship Tracker</title>
<style>
:root{--navy:#172554;--blue:#2563eb;--bg:#f4f7fb;--muted:#64748b;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font-family:Arial, sans-serif;background:var(--bg);color:#172033}
header{background:linear-gradient(120deg,#172554,#2563eb);color:white;padding:26px max(22px,calc((100% - 1100px)/2))}
header h1{margin:0 0 7px;font-size:27px}header p{margin:0;color:#dbeafe}
main{max-width:1100px;margin:26px auto;padding:0 18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat,.panel,.application{background:white;border:1px solid var(--line);border-radius:13px;box-shadow:0 3px 12px #0f172a08}
.stat{padding:17px}.stat span{display:block;color:var(--muted);font-size:13px}.stat strong{display:block;font-size:27px;margin-top:8px}
.panel{padding:21px;margin-bottom:22px}.panel h2{font-size:19px;margin:0 0 17px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
label{display:block;font-size:13px;font-weight:700;color:#334155;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:white}
textarea{min-height:82px;resize:vertical}
.field.full{grid-column:1/-1}.hidden{display:none!important}
.actions{display:flex;gap:9px;margin-top:17px;flex-wrap:wrap}
button{border:0;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer}
.primary{background:var(--blue);color:white}.secondary{background:#e2e8f0;color:#1e293b}.danger{background:#fee2e2;color:#991b1b}.small{padding:7px 10px;font-size:12px}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px;flex-wrap:wrap}
.toolbar h2{margin:0}.toolbar select{width:auto;min-width:160px}
.list{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.application{padding:17px}.app-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.application h3{margin:0 0 5px;font-size:17px}.role{color:var(--muted);font-size:14px}
.badge{font-size:11px;font-weight:700;border-radius:30px;padding:6px 9px;white-space:nowrap;background:#dbeafe;color:#1d4ed8}
.badge.Selected{background:#dcfce7;color:#166534}.badge.Rejected{background:#fee2e2;color:#991b1b}.badge.Completed{background:#ede9fe;color:#6d28d9}
.meta{font-size:13px;color:#475569;line-height:1.7;margin:13px 0}.learning{background:#f8fafc;border-radius:8px;padding:10px;font-size:13px;line-height:1.5;margin-top:10px}
.card-actions{display:flex;gap:8px;margin-top:14px}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:35px;background:white;border:1px dashed #cbd5e1;border-radius:12px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.list{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<header><h1>Internship Application Tracker</h1><p>Organize your applications, follow your progress, and record what you learn.</p></header>
<main>
<section class="stats">
 <div class="stat"><span>Total Applications</span><strong id="totalCount">0</strong></div>
 <div class="stat"><span>Applied</span><strong id="appliedCount">0</strong></div>
 <div class="stat"><span>Selected</span><strong id="selectedCount">0</strong></div>
 <div class="stat"><span>Completed</span><strong id="completedCount">0</strong></div>
</section>
<section class="panel">
 <h2 id="formTitle">Add Internship Application</h2>
 <form id="appForm">
  <div class="form-grid">
   <div class="field"><label for="company">Company Name *</label><input id="company" required maxlength="80" placeholder="e.g. ABC Technologies"></div>
   <div class="field"><label for="role">Internship Role *</label><input id="role" required maxlength="80" placeholder="e.g. Web Developer Intern"></div>
   <div class="field"><label for="date">Application Date *</label><input id="date" type="date" required></div>
   <div class="field"><label for="status">Status *</label><select id="status"><option>Applied</option><option>Selected</option><option>Rejected</option><option>Internship Completed</option></select></div>
   <div id="completionFields" class="field full hidden">
    <div class="form-grid">
     <div class="field"><label for="duration">Internship Duration *</label><input id="duration" placeholder="e.g. 2 months"></div>
     <div class="field full"><label for="learning">What did you learn? *</label><textarea id="learning" placeholder="Briefly describe your skills, tasks, and experience..."></textarea></div>
    </div>
   </div>
  </div>
  <div class="actions"><button class="primary" type="submit" id="saveButton">Add Application</button><button class="secondary hidden" type="button" id="cancelEdit">Cancel Edit</button></div>
 </form>
</section>
<section>
 <div class="toolbar"><h2>Your Applications</h2><select id="filter"><option value="All">All statuses</option><option>Applied</option><option>Selected</option><option>Rejected</option><option>Internship Completed</option></select></div>
 <div class="list" id="applicationList"></div>
</section>
</main>
<footer>Your information is stored locally in this browser on this device.</footer>
<script>
const STORAGE_KEY = "internshipTrackerApplications";
let applications = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let editingId = null;
const $ = id => document.getElementById(id);
const form = $("appForm");
const statusInput = $("status");

function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(applications)); }
function toggleCompletion(){
 const completed = statusInput.value === "Internship Completed";
 $("completionFields").classList.toggle("hidden", !completed);
 $("duration").required = completed;
 $("learning").required = completed;
}
statusInput.addEventListener("change", toggleCompletion);
$("date").value = new Date().toISOString().slice(0,10);

form.addEventListener("submit", event => {
 event.preventDefault();
 const status = statusInput.value;
 const item = {
  id: editingId || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
  company: $("company").value.trim(),
  role: $("role").value.trim(),
  date: $("date").value,
  status,
  duration: status === "Internship Completed" ? $("duration").value.trim() : "",
  learning: status === "Internship Completed" ? $("learning").value.trim() : ""
 };
 if(!item.company || !item.role || !item.date){ alert("Please complete all required fields."); return; }
 if(status === "Internship Completed" && (!item.duration || !item.learning)){
  alert("Please enter the internship duration and learning description."); return;
 }
 if(editingId){
  applications = applications.map(app => app.id === editingId ? item : app);
 } else { applications.unshift(item); }
 saveData(); resetForm(); render();
});

function resetForm(){
 editingId = null; form.reset(); $("date").value = new Date().toISOString().slice(0,10);
 $("formTitle").textContent = "Add Internship Application";
 $("saveButton").textContent = "Add Application";
 $("cancelEdit").classList.add("hidden"); toggleCompletion();
}
$("cancelEdit").addEventListener("click", resetForm);

function editApplication(id){
 const app = applications.find(a => a.id === id); if(!app) return;
 editingId = id; $("company").value = app.company; $("role").value = app.role;
 $("date").value = app.date; statusInput.value = app.status;
 $("duration").value = app.duration || ""; $("learning").value = app.learning || "";
 $("formTitle").textContent = "Edit Internship Application";
 $("saveButton").textContent = "Save Changes"; $("cancelEdit").classList.remove("hidden");
 toggleCompletion(); window.scrollTo({top:0,behavior:"smooth"});
}
function deleteApplication(id){
 if(!confirm("Delete this internship application?")) return;
 applications = applications.filter(a => a.id !== id); saveData(); render();
 if(editingId === id) resetForm();
}
function escapeHTML(value){
 return String(value).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function render(){
 $("totalCount").textContent = applications.length;
 $("appliedCount").textContent = applications.filter(a=>a.status==="Applied").length;
 $("selectedCount").textContent = applications.filter(a=>a.status==="Selected").length;
 $("completedCount").textContent = applications.filter(a=>a.status==="Internship Completed").length;
 const filter = $("filter").value;
 const shown = applications.filter(a=>filter==="All" || a.status===filter);
 const list = $("applicationList");
 if(!shown.length){ list.innerHTML = '<div class="empty">No applications found. Add your first internship application above.</div>'; return; }
 list.innerHTML = shown.map(a=>{
  const completed = a.status === "Internship Completed";
  const badgeClass = completed ? "Completed" : a.status;
  return `<article class="application">
   <div class="app-top"><div><h3>${escapeHTML(a.company)}</h3><div class="role">${escapeHTML(a.role)}</div></div><span class="badge ${badgeClass}">${escapeHTML(a.status)}</span></div>
   <div class="meta"><strong>Application date:</strong> ${escapeHTML(a.date)}${completed ? `<br><strong>Duration:</strong> ${escapeHTML(a.duration)}` : ""}</div>
   ${completed ? `<div class="learning"><strong>What I learned</strong><br>${escapeHTML(a.learning)}</div>` : ""}
   <div class="card-actions"><button class="secondary small" onclick="editApplication('${a.id}')">Edit</button><button class="danger small" onclick="deleteApplication('${a.id}')">Delete</button></div>
  </article>`;
 }).join("");
}
$("filter").addEventListener("change", render);
render(); toggleCompletion();
</script>
</body>
</html>
